<script>
  // Désactiver les AbortError globalement pour le développement
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    const originalPromise = window.Promise;
    
    window.Promise = class SafePromise extends originalPromise {
      constructor(executor) {
        super((resolve, reject) => {
          executor(
            resolve,
            (reason) => {
              // Intercepter et ignorer les AbortError
              if (reason && reason.name === 'AbortError') {
                console.log('[SafePromise] AbortError interceptée et ignorée:', reason.message);
                return;
              }
              reject(reason);
            }
          );
        });
      }
    };
    
    // Copier les méthodes statiques
    Object.setPrototypeOf(window.Promise, originalPromise);
    window.Promise.all = originalPromise.all;
    window.Promise.race = originalPromise.race;
    window.Promise.resolve = originalPromise.resolve;
    window.Promise.reject = originalPromise.reject;
    window.Promise.allSettled = originalPromise.allSettled;
    window.Promise.any = originalPromise.any;
    
    console.log('[DEV] SafePromise activé pour ignorer les AbortError');
  }
</script>
